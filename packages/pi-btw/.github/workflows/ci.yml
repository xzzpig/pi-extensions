name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Pi ${{ matrix.pi }}
    strategy:
      fail-fast: false
      matrix:
        pi: [locked, minimum, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Resolve compatibility version
        if: matrix.pi != 'locked'
        env:
          PI_VERSION: ${{ matrix.pi == 'minimum' && '0.85.1' || 'latest' }}
        run: >-
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact
          "@earendil-works/pi-ai@$PI_VERSION"
          "@earendil-works/pi-coding-agent@$PI_VERSION"
          "@earendil-works/pi-tui@$PI_VERSION"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
