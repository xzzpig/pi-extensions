name: Release

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: packages/pi-subagents

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Waits for the maintainer's approval on GitHub before anything is published.
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Install workspace dependencies
        uses: ./packages/pi-subagents/.github/actions/fork-setup
      - name: Run tests
        run: pnpm run test:all
      - name: Build and publish the bundled artifact
        run: pnpm publish --no-git-checks --provenance
