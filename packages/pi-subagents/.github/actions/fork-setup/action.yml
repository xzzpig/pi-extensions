name: Set up the pi-subagents workspace

description: Install the pnpm workspace and build bundled components.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 11.13.1
    - name: Install workspace dependencies
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm install --frozen-lockfile --ignore-scripts
    - name: Build bundled components
      shell: bash
      working-directory: ${{ github.workspace }}
      run: pnpm --filter @xzzpig/pi-components run build
