nodeLinker: hoisted

packages:
  - "packages/*"

linkWorkspacePackages: true

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  tree-sitter-bash: true

catalog:
  "@earendil-works/pi-agent-core": "1.1.0"
  "@earendil-works/pi-coding-agent": "1.1.0"
  "@earendil-works/pi-ai": "1.1.0"
  "@earendil-works/pi-tui": "1.1.0"
  "@types/node": "24.12.4"
  "typescript": "5.9.3"
  "vitest": "4.1.8"

# Keep the @earendil-works core tree the host-facing packages compile against
# at the version the host pi runs (1.1.0). Without these, pi-coding-agent's
# caret ranges pull newer releases (e.g. pi-agent-core 1.4.0) into dev-time
# types. Selectors are scoped to ^1.1.0 requests: pi-subagents keeps its own
# literal 1.0.0 SDK baseline (the shim fixture in test/fixtures is 1.0.0-shaped
# and its subtree record documents that baseline), so its pins stay untouched.
overrides:
  "@earendil-works/chord@^1.1.0": "1.1.0"
  "@earendil-works/pi-agent-core@^1.1.0": "1.1.0"
  "@earendil-works/pi-ai@^1.1.0": "1.1.0"
  "@earendil-works/pi-codemode@^1.1.0": "1.1.0"
  "@earendil-works/pi-mcp@^1.1.0": "1.1.0"
  "@earendil-works/pi-telemetry@^1.1.0": "1.1.0"
  "@earendil-works/pi-tui@^1.1.0": "1.1.0"

minimumReleaseAgeExclude:
  - "@xzzpig/pi-subagents"
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-agent-core@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-codemode@1.0.0"
  - "@earendil-works/pi-coding-agent@1.0.0"
  - "@earendil-works/pi-mcp@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@earendil-works/pi-tui@1.0.0"
