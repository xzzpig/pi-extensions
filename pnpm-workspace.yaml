nodeLinker: hoisted

packages:
  - "packages/*"

linkWorkspacePackages: true

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
  tree-sitter-bash: true

catalog:
  "@earendil-works/pi-agent-core": "1.1.0"
  "@earendil-works/pi-coding-agent": "1.1.0"
  "@earendil-works/pi-ai": "1.1.0"
  "@earendil-works/pi-tui": "1.1.0"
  "@types/node": "24.12.4"
  "typescript": "5.9.3"
  "vitest": "4.1.8"

# Keep the @earendil-works core tree the host-facing packages compile against
# at the version the host pi runs (1.1.0). Without these, pi-coding-agent's
# caret ranges pull newer releases (e.g. pi-agent-core 1.4.0) into dev-time
# types. Subagents requires Pi 1.2.0 and goal-x requires Pi 1.4.0; parent-specific
# overrides preserve each SDK baseline without raising the shared catalog.
# The subagents coding-agent shim remains a separate fixture.
overrides:
  "@xzzpig/pi-goal-x>@earendil-works/pi-ai": "1.4.0"
  "@xzzpig/pi-goal-x>@earendil-works/pi-coding-agent": "1.4.0"
  "@xzzpig/pi-goal-x>@earendil-works/pi-tui": "1.4.0"
  "@earendil-works/pi-coding-agent@1.4.0>@earendil-works/pi-agent-core": "1.4.0"
  "@earendil-works/pi-coding-agent@1.4.0>@earendil-works/pi-ai": "1.4.0"
  "@earendil-works/pi-coding-agent@1.4.0>@earendil-works/pi-codemode": "1.4.0"
  "@earendil-works/pi-coding-agent@1.4.0>@earendil-works/pi-mcp": "1.4.0"
  "@earendil-works/pi-coding-agent@1.4.0>@earendil-works/pi-tui": "1.4.0"
  "@earendil-works/pi-coding-agent@1.4.0>undici": "8.12.3"
  "@earendil-works/pi-agent-core@1.4.0>@earendil-works/pi-ai": "1.4.0"
  "@earendil-works/pi-ai@1.4.0>@earendil-works/pi-telemetry": "1.4.0"
  "@xzzpig/pi-subagents>@earendil-works/pi-agent-core": "1.2.0"
  "@xzzpig/pi-subagents>@earendil-works/pi-ai": "1.2.0"
  "@xzzpig/pi-subagents>@earendil-works/pi-tui": "1.2.0"
  "@earendil-works/pi-coding-agent@1.2.0>@earendil-works/pi-agent-core": "1.2.0"
  "@earendil-works/pi-coding-agent@1.2.0>@earendil-works/pi-ai": "1.2.0"
  "@earendil-works/pi-coding-agent@1.2.0>@earendil-works/pi-codemode": "1.2.0"
  "@earendil-works/pi-coding-agent@1.2.0>@earendil-works/pi-mcp": "1.2.0"
  "@earendil-works/pi-coding-agent@1.2.0>@earendil-works/pi-tui": "1.2.0"
  "@earendil-works/pi-coding-agent@1.2.0>undici": "8.12.3"
  "@earendil-works/pi-agent-core@1.2.0>@earendil-works/pi-ai": "1.2.0"
  "@earendil-works/pi-ai@1.2.0>@earendil-works/pi-telemetry": "1.2.0"
  "@earendil-works/chord@^1.1.0": "1.1.0"
  "@earendil-works/pi-agent-core@^1.1.0": "1.1.0"
  "@earendil-works/pi-ai@^1.1.0": "1.1.0"
  "@earendil-works/pi-codemode@^1.1.0": "1.1.0"
  "@earendil-works/pi-mcp@^1.1.0": "1.1.0"
  "@earendil-works/pi-telemetry@^1.1.0": "1.1.0"
  "@earendil-works/pi-tui@^1.1.0": "1.1.0"

minimumReleaseAgeExclude:
  - "@xzzpig/pi-subagents"
  - "@earendil-works/chord@1.0.0"
  - "@earendil-works/pi-agent-core@1.0.0"
  - "@earendil-works/pi-ai@1.0.0"
  - "@earendil-works/pi-codemode@1.0.0"
  - "@earendil-works/pi-coding-agent@1.0.0"
  - "@earendil-works/pi-mcp@1.0.0"
  - "@earendil-works/pi-telemetry@1.0.0"
  - "@earendil-works/pi-tui@1.0.0"
